experience:
  - id: ucla-math
    company: UCLA Department of Mathematics
    role: Researcher
    period: Spring 2026
    location: Los Angeles, CA
    description:
      - >
        Researching statistical arbitrage in cryptocurrency markets:
        constructing normalized spread series across liquid trading pairs
        and testing for mean reversion via cointegration analysis with
        walk-forward evaluation.
      - >
        Built a survivorship-bias-free dynamic universe spanning 100+
        liquid spot pairs, rebalancing daily on volume and spread thresholds.
      - >
        Tested mean-reversion hypotheses via Engle-Granger and Johansen
        cointegration on rolling windows; quantified half-life of mean
        reversion to size positions.

  - id: lutz-consulting
    company: Lutz Consulting Group
    role: Founder
    period: Nov 2024 - Present
    location: Las Vegas, NV
    description:
      - >
        Analyzed 138 months of client transaction data; built Gradient
        Boosting forecasting model with engineered lag, rolling, and
        seasonal features, achieving 11.5% MAPE, a 58% improvement over
        naive baseline on 24-month holdout, uncovering $550K+ in dead
        stock for liquidation.
      - >
        Engineered computer vision pipeline using GPT-4 Vision and AWS
        S3 to extract and classify 40,000+ product tags; built Streamlit
        review dashboard backed by PostgreSQL, enabling staff to reconcile
        full inventory in one weekend.
      - >
        Shipped end-to-end ML pipelines (data ingest → model → review UI
        → action) for non-technical clients; owned scoping, modeling,
        validation, deployment, and training.

  - id: new-york-life
    company: New York Life
    role: Data Analyst Intern
    period: June 2025 - Aug 2025
    location: New York, NY
    description:
      - >
        Built RAG-enabled underwriting chatbot prototype using company
        underwriting manual as knowledge base, demonstrating feasibility
        of LLM-powered policy guidance.
      - >
        Designed controlled experiments measuring LLM sycophancy: varied
        prompt authority framing across multiple models, measured response
        drift toward user-implied conclusions, and produced the team's
        first empirical model behavior finding that drove production
        prompt engineering policy.
      - >
        Finalist in company-wide AI Innovation Competition for prototyping
        RAG-enabled chatbot plugin for Tableau dashboards, querying 10+
        years of nationwide data with office-level granularity.


