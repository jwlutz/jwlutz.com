    github: https://github.com/jwlutz/chrome-ext-web-scraper
    live: https://chromewebstore.google.com/detail/yoinkai/afmmfhkdbnebcpidjfgjpkblmocpmbmm
    image: /chrome_extension.png
    featuredTag: Extension Available
    liveText: Extension Download

  - id: claude-code-framework
    title: Claude Code Framework
    description: >
      Structured workflows for Claude Code. I developed this system when
